# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  cache-version: v1

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          #- {os: macos-12,   r: 'release'}
          #- {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          #- {os: ubuntu-latest,   r: 'release'}
          #- {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install JAGS on Linux
        if: runner.os == 'linux'
        run: |
          run: |
          wget -O JAGS-5.0.1.tar.gz \
            https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-5.0.1.tar.gz/download

          echo "0888571b1812c8ce076ad6326c66f96a0ae7762497c346cd7eb32d35a62105d4  JAGS-5.0.1.tar.gz" | sha256sum -c -

          tar -xzf JAGS-5.0.1.tar.gz
          cd JAGS-5.0.1

          ./configure
          make -j2
          sudo make install
          sudo ldconfig

      - name: Install JAGS on macOS
        if: runner.os == 'macOS'
        run: brew install jags

      - name: SET JAGS_HOME homebrew
        if: runner.os == 'macOS'
        run: |
          options(width = 100)
          Sys.setenv(JAGS_HOME="/usr/local/Cellar/jags/5.0.2")
        shell: Rscript {0}

      - name: Install JAGS on Windows (R release)
        if: (runner.os == 'windows') && (matrix.config.r != 'oldrel')
        run: |
          curl --progress-bar -s -o 'C:\JAGS-5.0.2.exe' -L 'https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Windows/Rtools45/JAGS-5.0.2.exe'
          C:\JAGS-5.0.2.exe /S

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
